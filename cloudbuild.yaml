steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/snack-tracker/baby-tracker:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/snack-tracker/baby-tracker:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/snack-tracker/baby-tracker'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'baby-tracker'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/snack-tracker/baby-tracker:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/snack-tracker/baby-tracker:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/snack-tracker/baby-tracker:latest'
