apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: baby-tracker
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/baby-tracker:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: STORAGE_BACKEND
              value: firestore
            - name: FIRESTORE_PROJECT_ID
              value: babysnacktrack
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: baby-tracker-session-secret
                  key: latest
          resources:
            limits:
              cpu: "1000m"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
